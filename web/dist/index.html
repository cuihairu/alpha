<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alpha Finance（桌面骨架）</title>
    <!--
      桌面端 Tauri 前端兜底壳（TODO L112「搭建 Tauri + Rust 桌面应用框架」）。

      作用：tauri.conf.json 的 distDir 指向 web/dist，而 web/dist 是构建产物目录；
      新克隆仓库 / 未跑过 `npm run build` 时该目录为空，Tauri 窗口会全白。本文件
      是**受版本控制**的兜底壳：只依赖外部脚本 desktop-shell.js（与 tauri.conf.json
      的 CSP `default-src 'self'` 相容，不放开 script-src），通过 IPC 调用 Rust 命令，
      证明「窗口 → 前端 → Rust 命令 → alpha-core 计算」的最小闭环可用。

      `npm run build` 会用真实前端（web/index.html + app.js + WASM）覆盖本文件，
      之后 git status 显示本文件变更属预期。
    -->
    <style>
      /* L115 主题适配：深色为缺省基调，desktop-shell.js 按配置/系统在 <html>
         落 data-theme；配置 light/dark 强制覆盖，system 跟随 prefers-color-scheme
         （Tauri 1.x 原生装饰无运行期 set_theme，覆盖落在内容层 CSS 变量）。 */
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #171a21;
        --line: #262b36;
        --text: #e6e8ec;
        --muted: #9aa3b2;
        --chip: #232936;
        --up: #f0554d;
        --down: #2fb87a;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f4f5f7;
        --panel: #ffffff;
        --line: #d9dde3;
        --text: #171a20;
        --muted: #5c6572;
        --chip: #e8eaee;
      }
      body {
        margin: 0;
        padding: 32px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 20px; }
      .sub { color: var(--muted); margin-bottom: 24px; }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
      .card h2 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }      .kv { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
      .kv span:first-child { color: var(--muted); }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: right; padding: 5px 0; border-bottom: 1px solid var(--line); }
      th:first-child, td:first-child { text-align: left; }
      th { color: var(--muted); font-weight: 500; font-size: 12px; }
      .up { color: var(--up); }
      .down { color: var(--down); }
      .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: 12px; }
      code { background: var(--chip); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
      .hint { margin-top: 24px; color: var(--muted); }
      .err { color: var(--up); }
      button { background: var(--chip); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
      button:disabled { opacity: .45; cursor: default; }
      button:not(:disabled):hover { border-color: var(--muted); }
      /* L117 右键菜单（内容层 DOM：Tauri 1.x 无原生 context menu API），
         项数据来自 get_context_menu（框架层模型），可用性用 ctx-disabled 置灰 */
      .ctx-menu { position: fixed; z-index: 20; min-width: 220px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: 0 8px 28px rgba(0,0,0,.28); }
      .ctx-item { display: flex; justify-content: space-between; gap: 28px; padding: 6px 10px; border-radius: 5px; cursor: pointer; user-select: none; }
      .ctx-item:not(.ctx-disabled):hover { background: var(--chip); }
      .ctx-item.ctx-disabled { color: var(--muted); opacity: .5; cursor: default; }
      .ctx-hint { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Alpha Finance · 桌面骨架</h1>
    <p class="sub" id="banner">正在通过 IPC 初始化 Rust 侧…</p>

    <div class="grid">
      <div class="card">
        <h2>应用信息 <code>get_app_info</code></h2>
        <div id="app-info">—</div>
      </div>
      <div class="card">
        <h2>配置 <code>initialize_app</code></h2>
        <div id="config">—</div>
      </div>
      <div class="card">
        <h2>快照行情 <code>get_real_time_quotes</code></h2>
        <div id="quotes">—</div>
      </div>
      <div class="card">
        <h2>技术分析 <code>analyze_symbol</code></h2>
        <div id="analysis">—</div>
      </div>
      <div class="card">
        <h2>本地导出 <code>export_symbol_to_file</code></h2>
        <div id="export-result">—</div>
        <p><button id="export-btn" type="button">导出首个标的…</button></p>
      </div>
      <div class="card">
        <h2>告警与通知 <code>set_price_alert</code> <code>check_alerts</code></h2>
        <div id="alert-result">—</div>
        <div id="tray-status">—</div>
        <p><button id="alert-btn" type="button">布防并检查告警（上穿：现价 −1%）</button></p>
      </div>
      <div class="card">
        <h2>离线缓存与同步 <code>get_offline_quotes</code> <code>sync_offline_data</code></h2>
        <div id="offline-result">—</div>
        <div id="sync-result">—</div>
        <p>
          <button id="offline-btn" type="button">读取行情（带缓存来源）</button>
          <button id="sync-btn" type="button">联网增量同步</button>
        </p>
      </div>
    </div>

    <p class="hint" id="hint"></p>

    <script src="./desktop-shell.js"></script>
  </body>
</html>
