<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alpha Finance（桌面骨架）</title>
    <!--
      桌面端 Tauri 前端兜底壳（TODO L112「搭建 Tauri + Rust 桌面应用框架」）。

      作用：tauri.conf.json 的 distDir 指向 web/dist，而 web/dist 是构建产物目录；
      新克隆仓库 / 未跑过 `npm run build` 时该目录为空，Tauri 窗口会全白。本文件
      是**受版本控制**的兜底壳：只依赖外部脚本 desktop-shell.js（与 tauri.conf.json
      的 CSP `default-src 'self'` 相容，不放开 script-src），通过 IPC 调用 Rust 命令，
      证明「窗口 → 前端 → Rust 命令 → alpha-core 计算」的最小闭环可用。

      `npm run build` 会用真实前端（web/index.html + app.js + WASM）覆盖本文件，
      之后 git status 显示本文件变更属预期。
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #171a21;
        --line: #262b36;
        --text: #e6e8ec;
        --muted: #9aa3b2;
        --up: #f0554d;
        --down: #2fb87a;
      }
      body {
        margin: 0;
        padding: 32px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 20px; }
      .sub { color: var(--muted); margin-bottom: 24px; }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
      .card h2 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
      .kv { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
      .kv span:first-child { color: var(--muted); }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: right; padding: 5px 0; border-bottom: 1px solid var(--line); }
      th:first-child, td:first-child { text-align: left; }
      th { color: var(--muted); font-weight: 500; font-size: 12px; }
      .up { color: var(--up); }
      .down { color: var(--down); }
      .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; background: #232936; color: var(--muted); font-size: 12px; }
      code { background: #232936; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
      .hint { margin-top: 24px; color: var(--muted); }
      .err { color: var(--up); }
    </style>
  </head>
  <body>
    <h1>Alpha Finance · 桌面骨架</h1>
    <p class="sub" id="banner">正在通过 IPC 初始化 Rust 侧…</p>

    <div class="grid">
      <div class="card">
        <h2>应用信息 <code>get_app_info</code></h2>
        <div id="app-info">—</div>
      </div>
      <div class="card">
        <h2>配置 <code>initialize_app</code></h2>
        <div id="config">—</div>
      </div>
      <div class="card">
        <h2>快照行情 <code>get_real_time_quotes</code></h2>
        <div id="quotes">—</div>
      </div>
      <div class="card">
        <h2>技术分析 <code>analyze_symbol</code></h2>
        <div id="analysis">—</div>
      </div>
    </div>

    <p class="hint" id="hint"></p>

    <script src="./desktop-shell.js"></script>
  </body>
</html>
