[package]
name = "alpha-protocols"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# gRPC 传输与 proto 代码生成（仅服务端需要；wasm 侧取 --no-default-features 的纯 serde 契约层）
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

# 内部包
alpha-core = { workspace = true }

# 时间处理
chrono = { workspace = true }

[build-dependencies]
tonic-build = { version = "0.10", optional = true }

[features]
default = ["grpc"]
# grpc：生成并暴露 proto::data_engine 客户端/服务端（tonic transport，服务端专属）。
# 关闭后仍保留 rest/websocket/grpc 纯 serde 契约，wasm32 可编译（跨平台共享核心库，见
# docs/cross-platform-architecture.md §5）。
grpc = ["dep:tonic", "dep:prost", "dep:tonic-build"]
