[package]
name = "alpha-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 日期时间
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# 错误处理
anyhow = { workspace = true }
thiserror = { workspace = true }

# 数值计算
num-traits = "0.2"

# 异步支持
async-trait = { workspace = true }

[features]
default = ["std"]
std = []
wasm = ["chrono/wasmbind", "uuid/js"]

[dev-dependencies]
# 仅测试（platform 适配层参考实现的 #[tokio::test]）；不影响 lib/wasm 构建
tokio = { workspace = true, features = ["macros", "rt"] }

# 性能基准（L492/L495）：criterion 套件 + --save-baseline 基线比对回归；
# default-features 关掉 plotters/gnuplot（CI 无绘图依赖，数字输出即够）
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# 基准入口（harness = false：criterion 自带 main）
[[bench]]
name = "indicators_bench"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }

# JNI 错误映射（errors.rs 的 From<jni::errors::Error>）：此前只有 cfg 门控、
# 无对应依赖，android target 一编即 E0433——潜伏孤儿（从未参与编译所以从未
# 暴露），L301 android 交叉编译时暴露，按同文件 js-sys 先例对称补齐
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

# Rayon 多核并行：wasm32-unknown-unknown 无线程模型（Web Worker 承担并行，
# 见 wasm-analyzer/src/worker.rs），故按 target 门控——native 走真线程池，
# wasm32 由 parallel.rs 的顺序分支兜底（语义等价，见 check-cross-platform.sh 门禁）。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }