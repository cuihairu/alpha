[package]
name = "alpha-storage"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# 异步运行时
tokio = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 错误处理
anyhow = { workspace = true }

# 时间处理
chrono = { workspace = true }

# 内部包
alpha-core = { workspace = true, features = ["crypto"] }
# 消息契约（EventEnvelope；不带 grpc 传输面）
alpha-protocols = { workspace = true, default-features = false }

# 序列化
bincode = "1.3"

# HTTP 客户端（用于云存储）
reqwest = { version = "0.11", features = ["json"] }

# URL 编码
urlencoding = "2.1"
url = { workspace = true }

# 临时目录（用于测试）
tempfile = "3.8"

# 异步特征
async-trait = "0.1"
sqlx = { workspace = true }
tracing = { workspace = true }
redis = { workspace = true }

# ClickHouse 数据库
clickhouse = { workspace = true }
clickhouse-rs = { workspace = true }

# UUID
uuid = { workspace = true }

# Base64 编码（加密载荷存储）
base64 = "0.22"

# Parquet 湖写路径（docs/data-lake-parquet.md §3–§5；版本随 workspace 统一）
arrow = { workspace = true }
parquet = { workspace = true }

[features]
default = []
crypto = ["alpha-core/crypto"]

[dev-dependencies]
uuid = { workspace = true }
axum = { workspace = true }
