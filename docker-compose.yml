services:
  # TimescaleDB / PostgreSQL
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: alpha-timescaledb
    environment:
      POSTGRES_DB: alpha_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
    networks:
      - alpha-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alpha_finance"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ClickHouse 数据库 (高性能分析型数据库)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: alpha-clickhouse
    environment:
      CLICKHOUSE_DB: alpha_finance
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP 接口
      - "9000:9000"  # TCP 接口
      - "9004:9004"  # MySQL 接口
      - "9005:9005"  # PostgreSQL 接口
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./config/clickhouse-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./config/clickhouse-users.xml:/etc/clickhouse-server/users.d/users.xml
    networks:
      - alpha-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis 缓存 (用于会话和临时数据)
  redis:
    image: redis:7-alpine
    container_name: alpha-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - alpha-network
    restart: unless-stopped

  # API 网关
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: alpha-api-gateway
    ports:
      - "8080:8080"
    environment:
      # 真实反代上游（容器网络内按 compose 服务名解析；env 可覆写）
      - ALPHA_GATEWAY_DATA_ENGINE_URL=http://data-engine:8081
      - ALPHA_GATEWAY_REALTIME_URL=http://real-time-feed:8082
      - ALPHA_GATEWAY_COLLECTOR_URL=http://collector:8083
      - RUST_LOG=info
    depends_on:
      - data-engine
      - real-time-feed
      - collector
    networks:
      - alpha-network
    restart: unless-stopped

  # 数据处理引擎
  data-engine:
    build:
      context: .
      dockerfile: services/data-engine/Dockerfile
    container_name: alpha-data-engine
    ports:
      - "8081:8081"
    environment:
      - CLICKHOUSE_URL=http://admin:admin123@clickhouse:8123/alpha_finance
      - CLICKHOUSE_NATIVE_URL=tcp://admin:admin123@clickhouse:9000/alpha_finance
      - REDIS_URL=redis://redis:6379
      # 落库开关/地址部署时可从宿主机 env 或 .env 覆写（保持既有默认：启用 + timescaledb 服务）。
      # 注意 config-rs 键内下划线为单下划线（PERSISTENCE_ENABLED），服务间分隔符才是双下划线。
      - ALPHA__STORAGE__PERSISTENCE_ENABLED=${ALPHA__STORAGE__PERSISTENCE_ENABLED:-true}
      - ALPHA__STORAGE__TIMESCALE_URL=${ALPHA__STORAGE__TIMESCALE_URL:-postgres://postgres:postgres@timescaledb:5432/alpha_finance}
      # settings.rs 前缀是 ALPHA__，CLICKHOUSE_* 直通变量不会生效；显式打开 ClickHouse 后端
      - ALPHA__CLICKHOUSE__ENABLED=true
      - ALPHA__CLICKHOUSE__URL=http://admin:admin123@clickhouse:8123
      - ALPHA__CLICKHOUSE__DATABASE=alpha_finance
      - ALPHA__CLICKHOUSE__USER=admin
      - ALPHA__CLICKHOUSE__PASSWORD=admin123
      - RUST_LOG=info
    depends_on:
      - timescaledb
      - clickhouse
      - redis
    networks:
      - alpha-network
    restart: unless-stopped

  # 实时数据流服务
  real-time-feed:
    build:
      context: .
      dockerfile: services/real-time-feed/Dockerfile
    container_name: alpha-real-time-feed
    ports:
      - "8082:8082"
    environment:
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=info
    depends_on:
      - redis
    networks:
      - alpha-network
    restart: unless-stopped

  # 数据采集服务
  collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    container_name: alpha-collector
    ports:
      - "8083:8083"
    environment:
      - REDIS_URL=redis://redis:6379
      - CLICKHOUSE_URL=http://admin:admin123@clickhouse:8123/alpha_finance
      - CLICKHOUSE_NATIVE_URL=tcp://admin:admin123@clickhouse:9000/alpha_finance
      - TIMESCALE_URL=postgres://postgres:postgres@timescaledb:5432/alpha_finance
      - RUST_LOG=info
    depends_on:
      - redis
      - timescaledb
      - clickhouse
    networks:
      - alpha-network
    restart: unless-stopped

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: alpha-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - alpha-network
    restart: unless-stopped

  # Loki 日志聚合（L459 全链路监控：Promtail 采集容器日志 → Loki 存储 → Grafana 查询）
  loki:
    image: grafana/loki:latest
    container_name: alpha-loki
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - alpha-network
    restart: unless-stopped

  # Promtail：容器日志采集（docker 服务发现 → push Loki）
  promtail:
    image: grafana/promtail:latest
    container_name: alpha-promtail
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/positions
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - alpha-network
    restart: unless-stopped

  # Grafana 仪表板
  grafana:
    image: grafana/grafana:latest
    container_name: alpha-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      # provisioning：数据源（Prometheus + Loki）与预置仪表盘随容器启动自动注册
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    networks:
      - alpha-network
    restart: unless-stopped

  # Alertmanager（L464 实时告警）：接收 Prometheus 告警、分组/抑制/路由 → 多渠道通知
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alpha-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - alpha-network
    restart: unless-stopped

  # 告警 Webhook 接收器（L464 演示/开发用）：接收 Alertmanager 转发，可扩展对接钉钉/企业微信/Slack/PagerDuty
  alertmanager-webhook:
    build:
      context: .
      dockerfile: services/alert-webhook/Dockerfile
    container_name: alpha-alert-webhook
    ports:
      - "8084:8080"
    environment:
      - RUST_LOG=info
      # 可选：钉钉/企业微信/Slack Webhook URL（部署时通过 env 注入）
      - DINGTALK_WEBHOOK_URL=${DINGTALK_WEBHOOK_URL:-}
      - WECHAT_WEBHOOK_URL=${WECHAT_WEBHOOK_URL:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - PAGERDUTY_INTEGRATION_KEY=${PAGERDUTY_INTEGRATION_KEY:-}
    networks:
      - alpha-network
    restart: unless-stopped

  # Web 静态资源源站（L515）：serve web/dist 指纹产物，预压缩体 + 缓存头
  # 由挂载的 nginx 配置下发；CDN 在其前缘回源（docs/web-cdn.md）。
  # 上线顺序：cd web && npm run build（产 dist/）→ compose up web-origin
  web-origin:
    image: nginx:1.27-alpine
    container_name: alpha-web-origin
    ports:
      - '8088:80'
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./config/nginx/web-origin.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - alpha-network
    restart: unless-stopped

volumes:
  timescaledb_data:
  clickhouse_data:
  clickhouse_logs:
  redis_data:
  prometheus_data:
  loki_data:
  promtail_positions:
  grafana_data:
  alertmanager_data:

networks:
  alpha-network:
    driver: bridge
