global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'data-engine'
    static_configs:
      - targets: ['data-engine:8081']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'real-time-feed'
    static_configs:
      - targets: ['real-time-feed:8082']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'collector'
    static_configs:
      - targets: ['collector:8083']
    metrics_path: '/metrics'
    scrape_interval: 10s