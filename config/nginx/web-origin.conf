# Web 静态资源源站（L515）——CDN 回源目标，也可独立作小流量源站。
# 缓存策略与 web/dist/cache-manifest.json 一致：
#   指纹资产（*.hash8.*）  → immutable 一年（内容变 = 名字变，可激进缓存）
#   *.html / /            → no-cache（入口每次协商，发布即生效）
#   其余（无指纹 js/css）  → 5 分钟短缓存兜底
# 预压缩：optimize-dist.mjs 已产 .gz/.br，nginx 直接发预压缩体（零边缘 CPU），
# CDN 侧透传即可；Accept-Encoding 协商由 gzip_static/brotli_static 承担。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 预压缩静态体（ngx_http_gzip_static_module；brotli_static 为三方模块，
    # 不在官方 nginx 内——镜像换用 nginx-brotli 构建时打开下一行）
    gzip_static on;
    # brotli_static on;

    # 入口与 HTML：协商缓存（带 ETag，无强缓存）
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # 指纹资产：一年 immutable
    location ~* "\.[0-9a-f]{8}\.[a-zA-Z]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 其余静态：短缓存兜底（未被指纹的 js/css，渐进增强入口用）
    location / {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # 安全头（与桌面壳 CSP 口径一致的最小集）
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
