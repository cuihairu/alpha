[package]
name = "alpha-desktop"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# 框架层（零 Tauri 依赖）：可在缺 GUI 系统库的环境（Linux CI）编译与测试，
# 详见 docs/desktop-framework.md
name = "alpha_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# Tauri 框架（gui 特性门控）：Tauri 在 Linux 需 WebKitGTK + libsoup 系统库，
# macOS/Windows 免外部系统依赖；门控后框架层可在任意 CI 编译测试，
# GUI 接线由 CI Desktop 作业（macOS）验证
tauri = { version = "1.5", optional = true, features = ["dialog-open", "dialog-save", "fs-copy-file", "fs-create-dir", "fs-read-dir", "fs-read-file", "fs-remove-dir", "fs-remove-file", "fs-rename-file", "fs-write-file", "shell-open", "system-tray", "notification-all", "path-all", "global-shortcut-all"] }

# 仅用于**钉住解析版本**，代码里不引用它。
#
# 背景（上游 semver 破坏）：tauri → notify-rust 4 声明 `zbus = "5"`（仅 Linux/BSD），
# 解析到 zbus 5.11.0；zbus 5.11.0 又声明 `zbus_macros = "^5.11.0"`（caret），
# 这个区间**允许** zbus_macros 5.19.0 —— 而 5.19 的 `#[interface]`/`DBusError` 宏
# 生成的代码引用 zbus 5.11 未导出的 DispatchResult2 等符号，`cargo check` zbus 本体
# 即 9 个错误（E0425/E0433/E0599）。当前解析恰好落在 5.11.0，但那是索引与其它约束
# 的巧合，不是保证。
#
# 为什么写 `=` 精确约束而不提交 Cargo.lock：本仓 .gitignore 忽略锁文件（库惯例），
# CI 每次全新解析，没有锁文件兜底。代价是 zbus 本身也被锁在这条链上——想升 zbus 到
# 5.19 必须先解除本钉版，届时应在解析期就失败（响亮）而不是在 Linux 编译期静默烂掉。
# macOS 作业从不编译 zbus（Linux/BSD 专属），所以这个坑对 macOS CI 天然不可见。
# 见 docs/desktop-framework.md §4.2。
zbus-macros-pin = { package = "zbus_macros", version = "=5.11.0", optional = true }

# 异步运行时
tokio = { workspace = true }
# alpha-core 平台适配层 trait（KeyValueStore 等）为 async-trait 定义
async-trait = { workspace = true }

# 序列化
serde = { workspace = true }
# float_roundtrip：默认的 f64 快速解析有 ±1 ulp 误差，本地数据库（L116）的
# 快照往返必须逐位一致，否则「往返一致」单测在价格末位抖动
serde_json = { workspace = true, features = ["float_roundtrip"] }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# 时间处理
chrono = { workspace = true }

# 导出
csv = "1.3"

# 内部包
alpha-core = { workspace = true }

[dev-dependencies]
tempfile = "3"
# 纯 Rust 的 Tauri 配置解析库（无 GUI 系统依赖）：供 tests/tauri_config.rs
# 走与 tauri-build::build() 相同的解析路径，在无 GUI 依赖的环境校验配置 schema
tauri-utils = "1.6"

[[bin]]
name = "alpha-desktop"
path = "src/main.rs"

[features]
# gui：Tauri 接线层（窗口 + 命令 + generate_context）。Linux 需系统 GUI 依赖，
# 默认开启以保持 `cargo build`/`tauri dev` 行为不变；CI 的框架层门禁用
# --no-default-features 只编译测试 lib（见 scripts/check-desktop.sh）。
default = ["gui"]
gui = ["dep:tauri"]
# 生产构建自定义协议（tauri CLI 传 --features custom-protocol；此项同时拉起 gui）
custom-protocol = ["gui", "tauri?/custom-protocol"]