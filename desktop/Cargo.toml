[package]
name = "alpha-desktop"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# 框架层（零 Tauri 依赖）：可在缺 GUI 系统库的环境（Linux CI）编译与测试，
# 详见 docs/desktop-framework.md
name = "alpha_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# Tauri 框架（gui 特性门控）：Tauri 在 Linux 需 WebKitGTK + libsoup 系统库，
# macOS/Windows 免外部系统依赖；门控后框架层可在任意 CI 编译测试，
# GUI 接线由 CI Desktop 作业（macOS）验证
tauri = { version = "1.5", optional = true, features = ["dialog-open", "dialog-save", "fs-copy-file", "fs-create-dir", "fs-read-dir", "fs-read-file", "fs-remove-dir", "fs-remove-file", "fs-rename-file", "fs-write-file", "shell-open", "system-tray", "notification-all", "path-all", "global-shortcut-all"] }

# 仅用于**固定解析版本**，代码里不引用它（上游 semver 破坏：zbus 5.11 的依赖声明是
# `zbus_macros = "5.11.0"`（caret），会解析到 5.19，而 5.19 的宏生成的代码引用
# zbus 5.11 里不存在的 DispatchResult2 → Linux 上编 gui 特性直接失败。zbus 是 tauri
# 仅 Linux/BSD 的依赖，macOS 作业不编译它，故这个坑对 macOS CI 不可见。
# 写 `=` 精确约束而不是提交 Cargo.lock（本仓按库惯例忽略锁文件），这样 CI 全新解析
# 时也会得到可用版本。见 docs/desktop-framework.md §4.2。
zbus-macros-pin = { package = "zbus_macros", version = "=5.11.0", optional = true }

# 异步运行时
tokio = { workspace = true }
# alpha-core 平台适配层 trait（KeyValueStore 等）为 async-trait 定义
async-trait = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# 时间处理
chrono = { workspace = true }

# 导出
csv = "1.3"

# 内部包
alpha-core = { workspace = true }

[dev-dependencies]
tempfile = "3"
# 纯 Rust 的 Tauri 配置解析库（无 GUI 系统依赖）：供 tests/tauri_config.rs
# 走与 tauri-build::build() 相同的解析路径，在无 GUI 依赖的环境校验配置 schema
tauri-utils = "1.6"

[[bin]]
name = "alpha-desktop"
path = "src/main.rs"

[features]
# gui：Tauri 接线层（窗口 + 命令 + generate_context）。Linux 需系统 GUI 依赖，
# 默认开启以保持 `cargo build`/`tauri dev` 行为不变；CI 的框架层门禁用
# --no-default-features 只编译测试 lib（见 scripts/check-desktop.sh）。
default = ["gui"]
gui = ["dep:tauri"]
# 生产构建自定义协议（tauri CLI 传 --features custom-protocol；此项同时拉起 gui）
custom-protocol = ["gui", "tauri?/custom-protocol"]