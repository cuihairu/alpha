<path d="M300 1055 V1100 H240" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="api-obs" data-from="delivery" data-to="observability" d="M300 1055 V1100 H240" class="edge control" style="stroke:#c2410c;stroke-width:2" marker-end="url(#arrow)"/>
