<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">alpha · Data Platform Architecture</title>
<desc id="desc">Self-hosted A-share market data platform. Data flows top-down: public sources are ingested by the collector layer (services/collector: template tasks + cron + UA rotation + jittered backoff; crawlers/python reference scripts; proxy pool not wired) into the message queue. The queue defaults to Redis Streams (quotes.raw / quotes.normalized / quotes.dlq) and can evolve to NATS JetStream or Kafka. Processing services (data-engine: validation/schema mapping/enrichment/indicators, also serving gRPC :50051; real-time-feed; alert-webhook) consume and write to storage (TimescaleDB/PostgreSQL, ClickHouse Parquet export, Redis cache/dedup/rate-limit, S3/MinIO raw archival off by default). Delivery exposes REST /api/v1/*, WebSocket /ws and health/metrics via api-gateway; the Web UI is a quote/analysis dashboard. Bottom: observability with Prometheus /metrics, Grafana, Loki, Alertmanager + alert-webhook to DingTalk/WeCom/Slack/PagerDuty. Dashed lines are evolution/planned paths, solid lines are data flow.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.name{font-size:22px;font-weight:700}.body{font-size:17px;fill:#435570}.small{font-size:15px;fill:#52647b}.label{font-size:15px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.edge{fill:none;stroke-linejoin:round}.control{stroke-dasharray:7 5}</style>
<rect width="1200" height="1280" rx="20" fill="#f8fafc"/>
<text x="40" y="48" class="title" text-anchor="start">alpha · Data Platform Architecture</text>
<text x="40" y="80" class="body" text-anchor="start">Self-hosted financial data &amp; quant research foundation · ingest → normalize → store → query → real-time → indicators → backtest</text>

