<path d="M600 380 V420" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="collect-mq" data-from="collectors" data-to="mq" d="M600 380 V420" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
