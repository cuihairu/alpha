<path id="mq-process" data-from="mq" data-to="processing" d="M600 540 V580" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M600 720 V760" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="process-store" data-from="processing" data-to="storage" d="M600 720 V760" class="edge" style="stroke:#7c3aed;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
