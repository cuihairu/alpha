[package]
name = "alpha-collector"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true, features = ["full"] }
reqwest = { version = "0.11", features = ["json", "gzip", "brotli"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
config = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true }
url = { workspace = true }
rand = "0.8"
async-trait = "0.1"
async_ftp = "6"
metrics = { workspace = true }
metrics-exporter-prometheus = "0.13"
once_cell = "1.19"
tokio-stream = { version = "0.1", features = ["sync"] }
thiserror = { workspace = true }
redis = { workspace = true }
sqlx = { workspace = true }
prometheus = { workspace = true }
alpha-storage = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }

[features]
examples = []

[[example]]
name = "crawler_integration_demo"
path = "examples/crawler_integration_demo.rs"
required-features = ["examples"]

[[example]]
name = "integration_summary"
path = "examples/integration_summary.rs"
required-features = ["examples"]

[[example]]
name = "simple_integration_demo"
path = "examples/simple_integration_demo.rs"
required-features = ["examples"]
