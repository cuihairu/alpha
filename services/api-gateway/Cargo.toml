[package]
name = "alpha-api-gateway"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Web 框架
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
# TLS 终止（L485 登记：tls-rustls 依赖已备，服务内接线未落；当前由反代终结 TLS）
axum-server = { version = "0.7", features = ["tls-rustls"] }

# 异步运行时
tokio = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 配置管理
config = { workspace = true }
clap = { workspace = true }

# 日志和追踪
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# 指标（/metrics Prometheus 文本面）
metrics = { workspace = true }
metrics-exporter-prometheus = "0.13"

# 时间
chrono = { workspace = true }

# 错误处理
anyhow = { workspace = true }
thiserror = { workspace = true }

# HTTP 客户端
reqwest = { version = "0.11", features = ["json"] }

# WebSocket 反代上游客户端
tokio-tungstenite = "0.21"
futures-util = "0.3"

# JWT 认证（10.3 起修 GHSA-h395-gr6q-cpjc 类型混淆致授权绕过）。
# v10 起必须显式选 CryptoProvider：用 rust_crypto（纯 Rust，避免
# aws-lc-sys 的 cmake/C 工具链依赖）
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }

# UUID
uuid = { workspace = true }

# 内部包
alpha-core = { workspace = true }
alpha-protocols = { workspace = true }
alpha-storage = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
# L476：账户写穿持久化测试桩需实现 alpha_storage::StorageBackend（该 trait
# 由 async_trait 展开，故测试面同款依赖）
async-trait = { workspace = true }
# L485 TLS 端到端测试：in-test 自签证书（零外部文件）
rcgen = "0.13"
