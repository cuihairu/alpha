[workspace]
members = [
    # 跨平台核心库
    "packages/core",
    "packages/protocols",
    "packages/storage",

    # 服务端微服务
    "services/api-gateway",
    "services/data-engine",
    "services/real-time-feed",
    "services/collector",

    # 前端应用
    "wasm-analyzer",
    "desktop",

    # 开发工具
    "tools/build-tools"
]

exclude = [
    "mobile",
    "tools/benchmark",
    "tools/data-migration"
]

resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Alpha Finance Team"]
edition = "2021"
rust-version = "1.75"
license = "MIT"
homepage = "https://alpha.finance"
repository = "https://github.com/alpha-finance/platform"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Web 框架和 HTTP
axum = { version = "0.7", features = ["macros", "ws"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-br"] }
hyper = { version = "1.0", features = ["full"] }

# 数据处理
datafusion = "35.0"
arrow = "50.0"
parquet = "50.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 数据库
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# ClickHouse 数据库
clickhouse = { version = "0.11.6", features = ["tls"] }
clickhouse-rs = { version = "1.1.0-alpha.1" }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# gRPC 和 Protobuf
tonic = "0.10"
prost = "0.12"

# WebAssembly
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"

# 桌面端 (Tauri)
tauri = { version = "1.5", features = ["api-all"] }

# 移动端 JNI
jni = "0.21"
uniffi = "0.25"

# 日期时间
chrono = { version = "0.4.37", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 日志和追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 配置管理
config = "0.13"
clap = { version = "4.4", features = ["derive"] }
url = "2.5"

# 测试
tokio-test = "0.4"
proptest = "1.4"

# 性能监控
metrics = "0.21"
prometheus = "0.13"

# 内部包引用
alpha-core = { path = "packages/core" }
alpha-protocols = { path = "packages/protocols" }
alpha-storage = { path = "packages/storage" }

[patch.crates-io]
arrow-arith = { path = "patches/arrow-arith-50.0.0" }
