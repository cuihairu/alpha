name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本一致性门禁（TODO L472，与本地 scripts/check-version.sh 一致）
      - name: 版本一致性
        run: scripts/check-version.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 安装 protobuf-compiler
        # clippy 编译 alpha-protocols（默认 grpc 特性）触发 proto 代码生成，需要 protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      # Rust 代码规范门禁（docs/rust-code-standards.md §11，与本地 scripts/check-lint.sh 一致）
      - name: 格式化检查
        run: cargo fmt --all -- --check

      - name: Clippy（零警告）
        run: cargo clippy --workspace --all-targets --exclude alpha-desktop -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    # Redis 供 REDIS_TEST_URL 门控的管线集成测试真实运行（无 Redis 时测试自跳过）
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      - name: 运行测试
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
        run: cargo test --workspace --all-targets --exclude alpha-desktop

  desktop:
    name: Desktop (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      # gui 特性：Tauri 接线层（命令 + generate_context!）唯一能在无额外系统依赖的
      # runner 上编译的作业（macOS WKWebView 内置；Linux 需 WebKitGTK/libSoup）
      - name: 运行测试（gui 特性全量）
        run: cargo test -p alpha-desktop --all-targets

  desktop-framework:
    name: Desktop Framework
    runs-on: ubuntu-latest
    # 框架层（desktop lib，零 Tauri 依赖）：配置自洽性 + clippy + 单测。
    # 与 Desktop (macOS) 互补——Linux runner 无 GUI 依赖，靠 gui 特性门控把框架层
    # 拉进常规流水线（scripts/check-desktop.sh，与本地一致）。
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      - name: 桌面端框架门禁
        run: scripts/check-desktop.sh

  wasm:
    name: WebAssembly 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      - name: 安装 wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      # 跨平台兼容性门禁（wasm32 编译 + L0 依赖黑名单，含 tonic/prost 代码生成需 protoc）
      - name: 安装 protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: 跨平台兼容性检查
        run: scripts/check-cross-platform.sh

      - name: 构建 WASM
        run: |
          cd wasm-analyzer
          wasm-pack build --target web --out-dir pkg --release

      # Web 前端门禁（L427 React 骨架 + 旧演示页行为不回退守门；runner 自带 node）
      - name: Web 前端检查
        run: scripts/check-web.sh

  # 多目标平台并行构建（TODO L467，设计见 docs/cross-platform-architecture.md §7「CI 矩阵」）
  # fail-fast=false：单平台失败不取消其余平台的并行构建，信号互不遮蔽
  build:
    name: 构建（${{ matrix.target }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # 公共仓库免费 arm64 runner（服务器侧未来部署形态的前哨构建）
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # macOS 双架构：apple 工具链原生支持从 arm64 runner 交叉编译 x86_64（intel runner 已退役）
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 protobuf-compiler
        # tonic-build proto 代码生成需系统 protoc；跨平台 action 统一装并写 PATH
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 构建含测试目标的编译链接，运行期验证归 test/desktop 既有作业；alpha-desktop 排除：
      # Linux runner 无 WebKitGTK 系统依赖，GUI 作业单独覆盖（Desktop macOS + Desktop Framework）
      - name: 构建 workspace（含测试目标编译）
        run: cargo build --workspace --all-targets --exclude alpha-desktop --target ${{ matrix.target }}

  # 端到端跨服务冒烟（TODO L469）：真实进程四服务链路（聚合健康/REST+WS 反代/trace-id/业务指标）。
  # Windows 运行期缺 Redis 简单获取途径（windows runner 默认 Windows 容器），其编译面由 build 矩阵覆盖，
  # 运行期 e2e 先行 Linux/macOS；跨平台运行期矩阵归后续（登记见 TODO L469 标注）
  e2e:
    name: E2E（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 protobuf-compiler（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: 安装 protobuf-compiler（macOS）
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      # e2e 依赖 Redis（data-engine/real-time-feed 启动即连）
      - name: 启动 Redis（Linux，docker）
        if: runner.os == 'Linux'
        run: docker run -d --name e2e-redis -p 6379:6379 redis:7-alpine

      - name: 启动 Redis（macOS，brew）
        if: runner.os == 'macOS'
        run: brew install redis && redis-server --daemonize yes

      - name: 运行端到端冒烟
        run: scripts/check-e2e.sh

  security:
    name: 安全审计（报告型，不阻塞）
    runs-on: ubuntu-latest
    # 现存依赖漏洞属升级债（另行立项消化）；作业保持可见但不阻塞合并，
    # 避免长期红灯淹没 lint/test 的真信号（docs/rust-code-standards.md §11）
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 安装 cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: 运行安全审计
        run: cargo audit
