name: Deploy Docs

on:
  push:
    branches: [ main ]
    paths: [ 'docs/**', 'README.md' ]
  pull_request:
    branches: [ main ]
    paths: [ 'docs/**', 'README.md' ]

# GITHUB_TOKEN 权限设置
permissions:
  contents: read
  pages: write
  id-token: write

# 并发设置
concurrency:
  group: "pages"
  cancel-in-progress: false

# 默认环境变量
env:
  NODE_VERSION: '22'

jobs:
  # 构建文档
  build:
    name: Build Docs
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: 安装依赖
        working-directory: ./docs
        run: npm install

      - name: 显示环境信息
        working-directory: ./docs
        run: |
          node --version
          npm --version
          ls -la

      - name: 构建文档
        working-directory: ./docs
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/build

  # 部署到 GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4