[package]
name = "alpha-diagnose"
version = "0.1.0"
edition = "2021"
description = "智能故障诊断 CLI：Prometheus 指标快照 → 规则推理 → 根因建议报告（L464）"

[dependencies]
# 命令行参数（env 支持：ALPHA_PROMETHEUS_URL 环境变量）
clap = { workspace = true, features = ["env"] }
# 异步运行时
tokio = { workspace = true }
# 序列化（Prometheus API 响应）
serde = { workspace = true }
serde_json = { workspace = true }
# Prometheus HTTP API 查询
reqwest = { version = "0.11", features = ["json"] }
# 诊断引擎（纯函数规则推理）
alpha-core = { workspace = true }
